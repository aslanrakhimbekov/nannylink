services:
  # 1. Backend Web Service (Laravel Docker)
  - type: web
    name: nannylink-backend
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: APP_NAME
        value: NannyLink
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        value: base64:BUeoz8l9bwwSmiFVTBqOaEnLArnyYJ1vyFEOfrrLEjk=
      - key: APP_URL
        value: https://nannylink-backend.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: nannylink-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: nannylink-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: nannylink-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: nannylink-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: nannylink-db
          property: password
      - key: TELEGRAM_BOT_TOKEN
        value: "8011733085:AAEEKO9N5YzPS6SH79jjgfFqmRx2GJmSe5E"
      - key: CACHE_STORE
        value: database

  # 2. Frontend Static Site (React Vite)
  - type: web
    name: nannylink-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://nannylink-backend.onrender.com

databases:
  # 3. PostgreSQL Database
  - name: nannylink-db
    databaseName: nannylink
    user: nannylink_user
    plan: free
